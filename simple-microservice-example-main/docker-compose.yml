services:
  mongodb:
    build: ./MongoDB
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: pass
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "root", "-p", "pass", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  quoteservice:
    build: ./QuoteService
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: root
      MONGO_PASSWORD: pass
      MONGO_AUTH_SOURCE: admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/readyz')"]
      interval: 10s
      retries: 5

  apigateway:
    build: ./ApiGateway
    environment:
      QUOTES_API: http://quoteservice:5000
    depends_on:
      quoteservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/readyz').then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 10s
      retries: 5

  frontend:
    build: ./FrontendApplication

  nginx:
    build: ./NGINX
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - apigateway

volumes:
  mongo_data: