server {
  listen 80 default_server;
  listen [::]:80 default_server;
  

  location /api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_pass http://apigateway:3000;
  }

  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
  }
}
